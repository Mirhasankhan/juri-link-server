services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: juri-link-api
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=5000
      - DATABASE_URL=${DATABASE_URL:-mongodb://mongo:27017/juri-link}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - juri-network

  mongo:
    image: mongo:7.0
    container_name: juri-link-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - juri-network

  redis:
    image: redis:7-alpine
    container_name: juri-link-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - juri-network

volumes:
  mongo_data:
  redis_data:

networks:
  juri-network:
    driver: bridge
